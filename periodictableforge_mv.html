<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="PeriodicTableForge — Modern Views. GCSE Chemistry periodic table with multiple data views.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeriodicTableForge — Modern Views — ReviseForge</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f4ff;
  --surface2: #ede9fe;
  --border: #ddd6fe;
  --text: #1e0a3e;
  --text-muted: #6b45a0;
  --accent: #7c3aed;
  --accent2: #f5a623;
}
body.dark {
  --bg: #0f0f14;
  --surface: #16161f;
  --surface2: #1e1e2a;
  --border: #2a2a3d;
  --text: #e8e6f0;
  --text-muted: #7a7a9a;
  --accent: #a78bfa;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

header{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;text-decoration:none;line-height:1;}
.logo .lm{color:var(--text);}.logo .lf{color:var(--accent);}
.logo-sub{font-size:17px;color:var(--text);font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:1px;margin-left:8px;}
.byline{font-size:11px;color:var(--text-muted);text-align:right;}
.byline strong{color:var(--accent);font-weight:700;}
.header-right{display:flex;align-items:center;gap:12px;}
.theme-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:5px 12px;border:1.5px solid var(--border);border-radius:6px;background:none;color:var(--text-muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--text);}

.view-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;}
.view-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:none;color:var(--text-muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;letter-spacing:0.2px;}
.view-btn:hover{border-color:var(--accent);color:var(--accent);}
.view-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.legend-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex-shrink:0;min-height:36px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.leg-swatch{width:14px;height:14px;border-radius:3px;border:1.5px solid rgba(0,0,0,0.15);flex-shrink:0;}
.leg-scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
.leg-gradient{width:120px;height:12px;border-radius:3px;}
.view-desc{font-size:11px;color:var(--text-muted);font-style:italic;margin-left:auto;}

.table-outer{flex:1;overflow-x:auto;padding:12px 16px 20px;}
.table-grid{display:grid;grid-template-columns:repeat(18,minmax(46px,56px));grid-auto-rows:minmax(46px,56px);gap:3px;width:max-content;margin:0 auto;}

.el{border-radius:5px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform 0.12s,box-shadow 0.12s,background 0.3s,border-color 0.3s;padding:2px;overflow:hidden;}
.el:hover{transform:scale(1.18);z-index:10;box-shadow:0 6px 24px rgba(124,58,237,0.25);}
.el-z{font-family:'DM Mono',monospace;font-size:7.5px;line-height:1;opacity:0.65;}
.el-sym{font-family:'Bebas Neue',sans-serif;font-size:clamp(13px,1.7vw,19px);letter-spacing:0.5px;line-height:1;}
.el-sub{font-size:6.5px;font-weight:500;opacity:0.75;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;}

.gap{background:transparent;border:none;pointer-events:none;}
.period-label{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--text-muted);}

/* ── TOOLTIP — redesigned for clarity ── */
.tooltip{
  position:fixed;z-index:200;pointer-events:none;
  background:#fff;
  border:2px solid var(--accent);
  border-radius:14px;
  padding:0;
  min-width:260px;max-width:300px;
  box-shadow:0 12px 48px rgba(0,0,0,0.22);
  opacity:0;transition:opacity 0.15s;
  overflow:hidden;
}
body.dark .tooltip{background:#1e1e2a;}
.tooltip.visible{opacity:1;}

/* Header band */
.tt-head{
  background:var(--accent);
  padding:12px 16px 10px;
  display:flex;align-items:flex-end;gap:12px;
}
.tt-sym{
  font-family:'Bebas Neue',sans-serif;
  font-size:48px;letter-spacing:2px;line-height:1;
  color:#fff;flex-shrink:0;
}
.tt-head-info{display:flex;flex-direction:column;gap:2px;}
.tt-name{font-size:15px;font-weight:700;color:#fff;line-height:1.2;}
.tt-z-line{font-size:11px;color:rgba(255,255,255,0.75);font-family:'DM Mono',monospace;}
.tt-type{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-top:2px;}

/* Current view highlight */
.tt-highlight{
  background:var(--surface2);
  padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.tt-highlight-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);}
.tt-highlight-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--accent);}

/* Data rows */
.tt-body{padding:8px 16px 12px;display:flex;flex-direction:column;gap:4px;}
.tt-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;}
.tt-label{color:var(--text-muted);flex-shrink:0;}
.tt-val{font-family:'DM Mono',monospace;font-weight:600;color:var(--text);text-align:right;}

footer{border-top:1px solid var(--border);padding:10px 24px;font-size:11px;color:#111111;background:var(--surface);line-height:1.6;flex-shrink:0;}
.footer-label{font-weight:700;letter-spacing:1px;color:var(--accent);margin-right:6px;}

@media(max-width:580px){.logo-sub{display:none;}}
</style>
</head>

</div>

<div class="legend-bar" id="legendBar"></div>

<div class="table-outer">
  <div class="table-grid" id="periodicTable"></div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tt-head">

    <div class="tt-head-info">
      <div class="tt-name" id="ttName"></div>

  </div>
  <div class="tt-highlight" id="ttHighlight">

    <span class="tt-highlight-val" id="ttHVal"></span>
  </div>
  <div class="tt-body" id="ttRows"></div>
</div>

<footer>
  <span class="footer-label">DISCLAIMER</span>
  This tool was built for my own personal GCSE revision. You're welcome to use it, but it may contain errors and shouldn't be solely relied upon. Consider this a beta test. — <span style="color:var(--accent);font-weight:700;">Leon Dudhill</span>
</footer>

const BLOCK_COLOURS = {
  s:{bg:'#dbeafe',bd:'#3b5bdb',tx:'#1e3a8a'},
  p:{bg:'#fce7f3',bd:'#db2777',tx:'#831843'},
  d:{bg:'#d1fae5',bd:'#059669',tx:'#064e3b'},
  f:{bg:'#fef3c7',bd:'#d97706',tx:'#78350f'},
};

function getBlock(el) {
  if(el.t==='LAN'||el.t==='ACT') return 'f';
  if(el.c===1||el.c===2) return el.z===2?'p':'s';
  if(el.c>=3&&el.c<=12) return 'd';
  return 'p';
}

function heatColour(val,min,max,hFrom,hTo) {
  if(val===null) return{bg:'#f1f0f5',bd:'#c4b5fd',tx:'#6b7280'};
  const t=Math.max(0,Math.min(1,(val-min)/(max-min)));
  const h=hFrom+t*(hTo-hFrom),s=75,l=85-t*35;
  return{bg:`hsl(${h},${s}%,${l}%)`,bd:`hsl(${h},${s}%,${l-20}%)`,tx:`hsl(${h},${s}%,${Math.max(l-45,20)}%)`};
}

function getViewStyle(el,view) {
  const def={bg:'#f8f4ff',bd:'#7c3aed',tx:'#1e0a3e'};
  switch(view) {
    case 'standard':         return def;
    case 'type':             return TYPE_COLOURS[el.t]||def;
    case 'config':           return def;
    case 'mass':             return heatColour(el.ar,1,294,240,0);
    case 'electronegativity':return heatColour(el.en,0.7,4.0,240,0);
    case 'ionisation':       return heatColour(el.ie,375,2375,240,0);
    case 'radius':           return heatColour(el.rd,30,350,0,240);
    case 'block':            return BLOCK_COLOURS[getBlock(el)]||def;
    case 'oxidation':        return def;
    default:                 return def;
  }
}

function getSubText(el,view) {
  switch(view) {
    case 'standard':         return el.n;
    case 'type':             return (TYPE_COLOURS[el.t]||{lb:el.t}).lb.split(' ')[0];
    case 'config':           return el.cf;
    case 'mass':             return el.ar?.toFixed(1)||'?';
    case 'electronegativity':return el.en?.toFixed(2)||'—';
    case 'ionisation':       return el.ie?el.ie+' kJ':'—';
    case 'radius':           return el.rd?el.rd+' pm':'—';
    case 'block':            return getBlock(el)+'-block';
    case 'oxidation':        return el.ox;
    default:                 return el.n;
  }
}

// Highlight: what to show big in the tooltip for the current view
function getHighlight(el,view) {
  switch(view) {
    case 'standard':         return {label:'Element',val:el.n};
    case 'type':             return {label:'Type',val:(TYPE_COLOURS[el.t]||{lb:el.t}).lb};
    case 'config':           return {label:'Config',val:el.cf};
    case 'mass':             return {label:'Atomic Mass (Ar)',val:el.ar?el.ar.toFixed(3)+' u':'—'};
    case 'electronegativity':return {label:'Electronegativity',val:el.en?el.en.toFixed(2)+' (Pauling)':'—'};
    case 'ionisation':       return {label:'1st Ionisation',val:el.ie?el.ie+' kJ/mol':'—'};
    case 'radius':           return {label:'Atomic Radius',val:el.rd?el.rd+' pm':'—'};
    case 'block':            return {label:'Block',val:getBlock(el).toUpperCase()+'-block'};
    case 'oxidation':        return {label:'Oxidation States',val:el.ox||'—'};
    default:                 return {label:'Element',val:el.n};
  }
}

// BUILD TABLE
const tableEl=document.getElementById('periodicTable');
const elMap={};E.forEach(e=>elMap[`${e.r},${e.c}`]=e);
const cells={};

function buildTable(){
  tableEl.innerHTML='';
  for(let r=1;r<=7;r++){
    for(let c=1;c<=18;c++){
      const e=elMap[`${r},${c}`];
      if(e){const d=makeCell(e);tableEl.appendChild(d);cells[e.z]=d;}
      else if((r===6&&c===3)||(r===7&&c===3)){
        const ph=document.createElement('div');ph.className='el';
        ph.style.cssText='background:#f1f0f5;border-color:#c4b5fd;opacity:0.5;';
        ph.innerHTML=`<div class="el-sub" style="font-size:7px;color:#6b7280">${r===6?'57–71':'89–103'}</div>`;
        tableEl.appendChild(ph);
      } else{const g=document.createElement('div');g.className='gap';tableEl.appendChild(g);}
    }
  }
  for(let i=0;i<18;i++){const g=document.createElement('div');g.className='gap';g.style.height='8px';tableEl.appendChild(g);}
  for(let series=8;series<=9;series++){
    const g1=document.createElement('div');g1.className='gap';tableEl.appendChild(g1);
    const g2=document.createElement('div');g2.className='gap';tableEl.appendChild(g2);
    const lbl=document.createElement('div');lbl.className='period-label';
    lbl.style.cssText='font-size:8px;color:var(--text-muted);text-align:center;line-height:1.2;';
    lbl.textContent=series===8?'Lantha\u00adnides':'Acti\u00adnides';
    tableEl.appendChild(lbl);
    for(let c=4;c<=18;c++){
      const e=elMap[`${series},${c}`];
      if(e){const d=makeCell(e);tableEl.appendChild(d);cells[e.z]=d;}
      else{const g=document.createElement('div');g.className='gap';tableEl.appendChild(g);}
    }
  }
}

function makeCell(e){
  const d=document.createElement('div');d.className='el';
  d.innerHTML=`<div class="el-z">${e.z}</div><div class="el-sym">${fmtSym(e.s)}</div><div class="el-sub"></div>`;
  d.addEventListener('mouseenter',ev=>showTT(e,ev));
  d.addEventListener('mousemove',ev=>moveTT(ev));
  d.addEventListener('mouseleave',hideTT);
  return d;
}

function fmtSym(s){
  if(s.length===1)return s;
  return `${s[0]}<span style="font-size:0.62em;vertical-align:0.05em">${s[1].toLowerCase()}</span>${s.length>2?`<span style="font-size:0.62em;vertical-align:0.05em">${s[2].toLowerCase()}</span>`:''}`;
}

let currentView='standard';

function updateView(view){
  currentView=view;
  E.forEach(e=>{
    const cell=cells[e.z];if(!cell)return;
    const st=getViewStyle(e,view);
    cell.style.background=st.bg;cell.style.borderColor=st.bd;
    const sub=cell.querySelector('.el-sub');
    if(sub){sub.textContent=getSubText(e,view);sub.style.color=st.tx;}
    const sym=cell.querySelector('.el-sym');if(sym)sym.style.color=st.tx;
    const z=cell.querySelector('.el-z');if(z)z.style.color=st.tx;
  });
  renderLegend(view);
}

function renderLegend(view){
  const bar=document.getElementById('legendBar');bar.innerHTML='';
  const meta=VIEWS_META[view];
  const desc=document.createElement('span');desc.className='view-desc';desc.textContent=meta.desc;
  if(meta.legend==='type'){
    Object.entries(TYPE_COLOURS).forEach(([k,v])=>{
      const item=document.createElement('div');item.className='leg-item';
      item.innerHTML=`<div class="leg-swatch" style="background:${v.bg};border-color:${v.bd}"></div>${v.lb}`;
      bar.appendChild(item);
    });
  } else if(meta.legend==='block'){
    [['s','#dbeafe','#3b5bdb','s-block'],['p','#fce7f3','#db2777','p-block'],
     ['d','#d1fae5','#059669','d-block'],['f','#fef3c7','#d97706','f-block']].forEach(([,bg,bd,lb])=>{
      const item=document.createElement('div');item.className='leg-item';
      item.innerHTML=`<div class="leg-swatch" style="background:${bg};border-color:${bd}"></div>${lb}`;
      bar.appendChild(item);
    });
  } else if(meta.legend==='gradient'){
    const scale=document.createElement('div');scale.className='leg-scale';
    const grad=view==='radius'
      ?'linear-gradient(to right,#ef4444,#f97316,#eab308,#22c55e,#3b82f6)'
      :'linear-gradient(to right,#3b82f6,#22c55e,#eab308,#f97316,#ef4444)';
    scale.innerHTML=`<span>${meta.min}</span><div class="leg-gradient" style="background:${grad}"></div><span>${meta.max}</span>`;
    bar.appendChild(scale);
  }
  bar.appendChild(desc);
}

// TOOLTIP
const tooltip=document.getElementById('tooltip');

function showTT(e,ev){
  document.getElementById('ttSym').innerHTML=fmtSym(e.s);
  document.getElementById('ttName').textContent=e.n;
  document.getElementById('ttZLine').textContent=`Z = ${e.z}  ·  Ar = ${e.ar?.toFixed(3)||'—'}`;
  document.getElementById('ttType').textContent=(TYPE_COLOURS[e.t]||{lb:e.t}).lb;

  // Highlighted value for current view
  const hl=getHighlight(e,currentView);
  document.getElementById('ttHLabel').textContent=hl.label;
  document.getElementById('ttHVal').textContent=hl.val;

  // All data rows
  const rows=[
    ['Electron Config', e.cf],
    ['Atomic Mass', e.ar?e.ar.toFixed(3)+' u':'—'],
    ['Electronegativity', e.en?e.en.toFixed(2)+' (Pauling)':'—'],
    ['1st Ionisation', e.ie?e.ie+' kJ/mol':'—'],
    ['Atomic Radius', e.rd?e.rd+' pm':'—'],
    ['Oxidation States', e.ox||'—'],
    ['Block', getBlock(e)+'-block'],
  ];
  document.getElementById('ttRows').innerHTML=rows.map(([l,v])=>
    `<div class="tt-row"><span class="tt-label">${l}</span><span class="tt-val">${v}</span></div>`
  ).join('');

  tooltip.classList.add('visible');
  moveTT(ev);
}
function moveTT(ev){
  let l=ev.clientX+16,t=ev.clientY+16;
  if(l+300>window.innerWidth-10) l=ev.clientX-300-16;
  if(t+320>window.innerHeight-10) t=ev.clientY-320-16;
  tooltip.style.left=l+'px';tooltip.style.top=t+'px';
}
function hideTT(){tooltip.classList.remove('visible');}

// VIEW BUTTONS
document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    updateView(btn.dataset.view);
  });
});

// DARK MODE
let isDark=false;
document.getElementById('themeBtn').addEventListener('click',()=>{
  isDark=!isDark;
  document.body.classList.toggle('dark',isDark);
  document.getElementById('themeBtn').textContent=isDark?'☀ Light Mode':'🌙 Dark Mode';
  updateView(currentView);
});

buildTable();
updateView('standard');
</script>
